# Temporary: checks the npm install on macOS (bundle naming and the shortcut script).
name: mac bundle test

on:
  push:
    branches:
      - feature/npm-distribution

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run compile -- --production

      - name: pack and install
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install -g --ignore-scripts --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP"/tet-ide-*.tgz

      - name: start tet
        run: |
          time "$RUNNER_TEMP/prefix/bin/tet" --user-data-dir="$RUNNER_TEMP/ud" --allow-shell-only
          sleep 20

      - name: inspect
        run: |
          set -x
          pgrep -afl "tet-node"
          ls "$RUNNER_TEMP/ud/shortcuts"
          cat "$RUNNER_TEMP/ud/shortcuts/failed.log" || echo "no failures"
          ls -laR ~/Applications/TET.app
          plutil -lint ~/Applications/TET.app/Contents/Info.plist
          cat ~/Applications/TET.app/Contents/MacOS/tet
          codesign --verify --deep --strict "$RUNNER_TEMP/prefix/lib/node_modules/tet-ide/node_modules/electron/dist/Electron.app"
          pkill -f "tet-node" || true
          sleep 5
          open ~/Applications/TET.app
          sleep 25
          pgrep -afl "tet-node" || { echo "TET did not start from the app wrapper"; exit 1; }
