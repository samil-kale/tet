# Temporary: checks the npm install on macOS (electron's bundle untouched, the app wrapper).
name: mac bundle test

on:
  push:
    branches:
      - feature/npm-distribution

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run compile -- --production

      - name: pack and install
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install -g --ignore-scripts --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP"/tet-ide-*.tgz

      - name: start tet
        run: |
          "$RUNNER_TEMP/prefix/bin/tet" --user-data-dir="$RUNNER_TEMP/ud" --allow-shell-only
          sleep 20

      - name: inspect
        run: |
          set -x
          bundle="$RUNNER_TEMP/prefix/lib/node_modules/tet-ide/node_modules/electron/dist/Electron.app"
          pgrep -afl "tet-node"
          plutil -extract CFBundleName raw "$bundle/Contents/Info.plist"
          codesign -dv "$bundle" 2>&1 | grep -E "Authority|Signature|TeamIdentifier"
          codesign --verify --deep --strict "$bundle" || echo "electron's own signature does not verify strictly"
          cat "$RUNNER_TEMP/ud/shortcuts/failed.log" || echo "no failures"
          ls -la ~/Applications/TET.app/Contents/Resources
          pkill -f "tet-node" || true
          sleep 5
          open ~/Applications/TET.app
          sleep 25
          pgrep -afl "tet-node" || { echo "TET did not start from the app wrapper"; exit 1; }
