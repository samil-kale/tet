# The release: one runner per platform, since a dmg is only built on macOS, an AppImage and a
# deb only on Linux, and node-pty's prebuilt binary is picked per platform as well. Publishing
# straight to a GitHub Release is the only release path there is — a tag is what makes one.
name: Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # electron-builder's GitHub publisher creates the release for a tag if it doesn't find one
  # yet, once per artifact — a macOS build alone already races itself over the .dmg and its
  # .blockmap, and the three platforms publish as three concurrent jobs on top of that. Creating
  # it here first, before any of them, means every "always" step below just finds it (matching
  # what electron-builder itself would have named it — no "v", empty notes).
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # electron-builder names a release it creates itself after the bare version, no "v" —
        # matched here so this pre-created one reads the same way.
        run: gh release create "$GITHUB_REF_NAME" --repo "${{ github.repository }}" --title "${GITHUB_REF_NAME#v}" --notes ""

  build:
    needs: prepare-release
    strategy:
      # One platform failing must not take the other two installers with it.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # electron has no postinstall download step; it fetches its binary lazily on first
      # `require("electron")`. Left to happen inside `npm test`, several test files trigger
      # that download at once (node --test runs them concurrently), racing to extract the same
      # zip — ETXTBSY on Linux, a startup timeout on Windows. One serial fetch here avoids it.
      - run: node -e "require('electron')"

      # The same three gates the working copy is held to, before anything is packaged. The
      # tests are what exercises the control channel's socket on each platform — a named pipe
      # here, a socket file on the other two.
      - run: npm run typecheck
      - run: npm run lint
      # test/app.test.ts starts the real app, which wants a display; the other two runners
      # have one.
      - run: xvfb-run -a npm test
        if: runner.os == 'Linux'
      - run: npm test
        if: runner.os != 'Linux'

      - run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
