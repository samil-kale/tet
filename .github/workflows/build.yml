# The release: a tag makes one. tet ships as one archive per platform and architecture on the
# GitHub Release, which scripts/install.sh and scripts/install.ps1 install from and the app updates
# itself from. Nothing is released unless every platform passed both the tests and the install
# test of the very archives it built.
name: Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    strategy:
      # All three platforms report, even when one fails: a release waits for every one of them.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # electron has no postinstall download step; it fetches its binary lazily on first
      # `require("electron")`. Left to happen inside `npm test`, several test files trigger
      # that download at once (node --test runs them concurrently), racing to extract the same
      # zip — ETXTBSY on Linux, a startup timeout on Windows. One serial fetch here avoids it.
      - run: node -e "require('electron')"

      # The same three gates the working copy is held to, before anything is packaged. The
      # tests are what exercises the control channel's loopback TCP port on each platform.
      - run: npm run typecheck
      - run: npm run lint
      # test/app.test.ts starts the real app, which wants a display; the other two runners
      # have one.
      - run: xvfb-run -a npm test
        if: runner.os == 'Linux'
      - run: npm test
        if: runner.os != 'Linux'

  # The archives, one runner per platform, and what a user does with the one for this runner's
  # architecture: install it with the script, start it, let it update itself on quit, start the
  # new version (test/install.test.ts).
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TET_INSTALL_TEST: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: node -e "require('electron')"

      - run: npm run dist

      - run: xvfb-run -a node --test dist-test/install.test.js
        if: runner.os == 'Linux'
      - run: node --test dist-test/install.test.js
        if: runner.os != 'Linux'

      - uses: actions/upload-artifact@v4
        with:
          name: archives-${{ runner.os }}
          path: |
            release/TET-*.zip
            release/TET-*.tar.gz
          if-no-files-found: error

  # The GitHub Release for the tag, named after the bare version (no "v"), carrying the notes and
  # every archive. Marked latest: `releases/latest` is what the scripts and the update ask.
  release:
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The notes are the version's section of CHANGELOG.md, written by hand before the tag
        # (see "Releasing" in AGENTS.md): everything between its "## <version>" heading and the
        # next one. A version without a section gets empty notes, as before.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "${{ github.repository }}" --title "$version" --notes-file notes.md archives/*
