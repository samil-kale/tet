# The release: a tag makes one. tet ships as the `tet-ide` package on npm and nothing else — one
# package for every platform, since electron fetches its own binary on first start and node-pty
# carries prebuilt files for all of them. Nothing is published unless every platform passed both
# the tests and the install test; the GitHub Release with the notes comes last.
name: Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    strategy:
      # All three platforms report, even when one fails: a publish waits for every one of them.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # electron has no postinstall download step; it fetches its binary lazily on first
      # `require("electron")`. Left to happen inside `npm test`, several test files trigger
      # that download at once (node --test runs them concurrently), racing to extract the same
      # zip — ETXTBSY on Linux, a startup timeout on Windows. One serial fetch here avoids it.
      - run: node -e "require('electron')"

      # The same three gates the working copy is held to, before anything is packaged. The
      # tests are what exercises the control channel's socket on each platform — a named pipe
      # here, a socket file on the other two.
      - run: npm run typecheck
      - run: npm run lint
      # test/app.test.ts starts the real app, which wants a display; the other two runners
      # have one.
      - run: xvfb-run -a npm test
        if: runner.os == 'Linux'
      - run: npm test
        if: runner.os != 'Linux'

  # What a user does, on each platform: install the package from a registry, start it, let it
  # update itself on quit, start the new version (test/install.test.ts). Built for production, as
  # prepublishOnly builds what is published.
  install-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TET_INSTALL_TEST: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run compile -- --production

      - run: xvfb-run -a node --test dist-test/install.test.js
        if: runner.os == 'Linux'
      - run: node --test dist-test/install.test.js
        if: runner.os != 'Linux'

  # Trusted publishing: npm takes this workflow's OIDC token as the credential, no secret held
  # anywhere — the package's settings on npmjs.com name this repository and this file.
  publish:
    needs: [test, install-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The OIDC token, which is also what signs the provenance statement.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # No `registry-url`: with it, setup-node writes an .npmrc taking the token from
      # NODE_AUTH_TOKEN and sets that to a placeholder — npm then sends the placeholder as its
      # credential instead of the OIDC token, and the registry answers 404 (measured).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Node 22 ships npm 10; trusted publishing needs 11.5.1 or later.
      - run: npm install -g npm@latest

      - run: npm ci

      # prepublishOnly builds dist/ for production first; `files` in package.json is what goes in.
      # Verbose, so a refused OIDC exchange shows in the log rather than as a bare "need auth".
      - run: npm --version && npm publish --access public --loglevel verbose

  # The GitHub Release for the tag, once the package is out, named after the bare version (no "v")
  # as the installer releases before it were. Never marked latest: the installers up to 0.5.x ask
  # GitHub's /releases/latest for their update, and a release without their files would leave them
  # there for good instead of on 0.5.2, the last installer, which tells them to move to npm.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The notes are the version's section of CHANGELOG.md, written by hand before the tag
        # (see "Releasing" in CLAUDE.md): everything between its "## <version>" heading and the
        # next one. A version without a section gets empty notes, as before.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "${{ github.repository }}" --title "$version" --notes-file notes.md --latest=false
