# The release: one runner per platform, since a dmg is only built on macOS, an AppImage and a
# deb only on Linux, and node-pty's prebuilt binary is picked per platform as well. Publishing
# straight to a GitHub Release is the only release path there is — a tag is what makes one.
name: Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing must not take the other two installers with it.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same three gates the working copy is held to, before anything is packaged. The
      # tests are what exercises the control channel's socket on each platform — a named pipe
      # here, a socket file on the other two.
      - run: npm run typecheck
      - run: npm run lint
      # test/app.test.ts starts the real app, which wants a display; the other two runners
      # have one.
      - run: xvfb-run -a npm test
        if: runner.os == 'Linux'
      - run: npm test
        if: runner.os != 'Linux'

      - run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
