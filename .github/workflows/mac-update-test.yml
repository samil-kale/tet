# Temporary: the whole update flow of an npm install on macOS, against a local registry.
name: mac update test

on:
  push:
    branches:
      - feature/npm-distribution

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run compile -- --production

      - name: pack 0.5.1 and a 0.5.99 copy
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/v99"
          tar -xzf "$RUNNER_TEMP/tet-ide-0.5.1.tgz" -C "$RUNNER_TEMP/v99"
          node -e "const f=process.argv[1];const fs=require('fs');const p=JSON.parse(fs.readFileSync(f,'utf8'));p.version='0.5.99';fs.writeFileSync(f,JSON.stringify(p,null,2))" "$RUNNER_TEMP/v99/package/package.json"
          (cd "$RUNNER_TEMP/v99/package" && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP")

      - name: local registry
        run: |
          mkdir -p "$RUNNER_TEMP/registry"
          cat > "$RUNNER_TEMP/registry/config.yaml" <<'EOF'
          storage: ./storage
          auth:
            htpasswd:
              file: ./htpasswd
              max_users: -1
          uplinks:
            npmjs:
              url: https://registry.npmjs.org/
          packages:
            'tet-ide':
              access: $all
              publish: $anonymous
            '**':
              access: $all
              proxy: npmjs
          log: { type: stdout, format: pretty, level: warn }
          EOF
          (cd "$RUNNER_TEMP/registry" && nohup npx -y verdaccio@6.10.3 --config ./config.yaml --listen 127.0.0.1:4873 > verdaccio.log 2>&1 &)
          for i in $(seq 1 60); do curl -s http://127.0.0.1:4873/-/ping > /dev/null && break; sleep 1; done
          printf 'registry=http://127.0.0.1:4873/\n//127.0.0.1:4873/:_authToken=local-test\n' > "$RUNNER_TEMP/npmrc"

      - name: publish, install 0.5.1, start, quit, update
        env:
          npm_config_registry: http://127.0.0.1:4873/
        run: |
          export npm_config_userconfig="$RUNNER_TEMP/npmrc"
          npm publish "$RUNNER_TEMP/tet-ide-0.5.1.tgz" --ignore-scripts
          npm publish "$RUNNER_TEMP/tet-ide-0.5.99.tgz" --ignore-scripts
          npm install -g --ignore-scripts --prefix "$RUNNER_TEMP/prefix" tet-ide@0.5.1
          pkg="$RUNNER_TEMP/prefix/lib/node_modules/tet-ide"
          echo "installed: $(node -p "require('$pkg/package.json').version")"
          "$RUNNER_TEMP/prefix/bin/tet" --user-data-dir="$RUNNER_TEMP/ud" --allow-shell-only
          sleep 25
          screencapture -x "$RUNNER_TEMP/available.png" || true
          main=$(pgrep -f "Electron.*--tet-installed" | head -1)
          echo "tet running: $main"
          # The quit a user gives with Cmd+Q: an Apple Event to the app, not a signal.
          osascript -e 'tell application id "com.github.Electron" to quit' || echo "quit event failed"
          for i in $(seq 1 60); do kill -0 "$main" 2>/dev/null || break; sleep 0.5; done
          echo "tet gone: $(kill -0 "$main" 2>/dev/null && echo no || echo yes)"
          pgrep -afl tet-update || echo "no updater seen"
          for i in $(seq 1 180); do [ -f "$RUNNER_TEMP/ud/update/result.json" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/ud/update/result.json" || { echo "no result file"; exit 1; }
          echo
          echo "installed now: $(node -p "require('$pkg/package.json').version")"
          test -x "$pkg/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron" && echo "electron present"

      - name: next start reports the update
        env:
          npm_config_registry: http://127.0.0.1:4873/
        run: |
          "$RUNNER_TEMP/prefix/bin/tet" --user-data-dir="$RUNNER_TEMP/ud" --allow-shell-only
          sleep 12
          screencapture -x "$RUNNER_TEMP/updated.png" || true
          test ! -f "$RUNNER_TEMP/ud/update/result.json" && echo "result consumed"
          pgrep -afl "Electron.*--tet-installed" | head -1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-update-screens
          path: |
            ${{ runner.temp }}/available.png
            ${{ runner.temp }}/updated.png
            ${{ runner.temp }}/registry/verdaccio.log
