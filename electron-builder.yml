# What turns the compiled dist/ into something installable, per platform. Its own file rather
# than a block in package.json, so the reasons below can be written down at all.
appId: com.samilkale.tet
productName: TET

directories:
  # esbuild already owns dist/, and electron-builder would write its installers into the same
  # folder it is packaging.
  output: release

# Everything the app needs at runtime. node_modules is not listed: electron-builder takes the
# production dependencies by itself, which is node-pty and electron-updater.
files:
  - dist/**
  - package.json

# node-pty is a native addon, and a .node inside the asar archive cannot be loaded — the
# platform's dynamic linker only opens real files.
asarUnpack:
  - "**/node_modules/node-pty/**"
  # The tet-ctl CLI is run by a separate process (electron as node, from a terminal) that
  # cannot read inside the archive — see src/main/control/control-launcher.ts.
  - dist/tet-ctl.js

# Nothing to compile: node-pty ships prebuilt binaries for all six platform/arch pairs and is
# built on node-addon-api, so the same file works under Electron's ABI as under Node's. This is
# also what keeps a rebuild toolchain off the build machine.
npmRebuild: false

win:
  icon: src/renderer/icon.ico
  target: nsis

mac:
  # Generated from the 1200px png; macOS wants at least 512.
  icon: src/renderer/icon.png
  category: public.app-category.developer-tools
  target: dmg

linux:
  icon: src/renderer/icon.png
  category: Development
  # A deb refuses to build without one.
  maintainer: Samil Kale <kale.samil@gmail.com>
  target:
    - AppImage
    - deb

# Where the release workflow's `npm run dist -- --publish always` uploads the installers, and
# where the running app's electron-updater looks for them. The repo is public, so no token is
# needed to read releases — only to publish, which the workflow does with its own GITHUB_TOKEN.
publish:
  provider: github
  owner: samil-kale
  repo: tet
  # electron-builder defaults to a draft release; publish straight to a real one.
  releaseType: release
